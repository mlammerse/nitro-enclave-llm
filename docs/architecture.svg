<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">nitro-enclave-llm architecture (PoC)</title>
  <desc id="d">Control plane on a Mac connects via SSM session to an EC2 parent instance in AWS ap-southeast-2. The parent runs vsock-bridge.py on 127.0.0.1:8080, which relays over AF_VSOCK CID 16 port 5000 to a Nitro Enclave running vsock-server.py, llama.cpp and a baked-in Llama 3.2 3B Q4 model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h    { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub  { font-size: 12px; fill: #475569; }
      .code { font-size: 13px; fill: #0f172a; }
      .lbl  { font-size: 12px; fill: #334155; }
      .cap  { font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: .04em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- Column captions -->
  <text x="40" y="44" class="sans cap">Your Mac (control plane)</text>
  <text x="380" y="44" class="sans cap">AWS ap-southeast-2 (Sydney)</text>

  <!-- Control plane -->
  <rect x="40" y="110" width="250" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="140" class="sans h">Control plane</text>
  <text x="60" y="166" class="mono code">aws cli / gh / ssm</text>
  <text x="60" y="188" class="sans sub">docs + scripts · no model, no inference</text>

  <!-- AWS region -->
  <rect x="380" y="60" width="580" height="420" rx="14" fill="#fffbf5" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- EC2 parent -->
  <rect x="410" y="90" width="520" height="364" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="120" class="sans h">EC2 parent</text>
  <text x="430" y="140" class="sans sub">c6i.2xlarge · Amazon Linux 2023 · SSM only, zero inbound rules</text>

  <!-- SSM arrow -->
  <line x1="290" y1="158" x2="404" y2="158" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="347" y="148" text-anchor="middle" class="sans lbl">SSM session</text>

  <!-- vsock bridge -->
  <rect x="450" y="164" width="440" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="670" y="189" text-anchor="middle" class="mono code" font-weight="600">vsock-bridge.py</text>
  <text x="670" y="209" text-anchor="middle" class="mono sub">HTTP on 127.0.0.1:8080</text>

  <!-- vsock arrow -->
  <line x1="670" y1="222" x2="670" y2="284" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="684" y="258" class="mono lbl">AF_VSOCK · CID 16 : port 5000</text>

  <!-- Enclave -->
  <rect x="450" y="290" width="440" height="140" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <!-- lock glyph -->
  <g transform="translate(470,308)" fill="none" stroke="#059669" stroke-width="1.8">
    <rect x="0" y="8" width="16" height="12" rx="2" fill="#059669"/>
    <path d="M3,8 V5 a5,5 0 0 1 10,0 V8"/>
  </g>
  <text x="496" y="325" class="sans h">Nitro Enclave</text>
  <text x="870" y="325" text-anchor="end" class="sans sub" fill="#047857">no network · no disk · no GPU</text>
  <line x1="470" y1="340" x2="870" y2="340" stroke="#a7f3d0" stroke-width="1"/>
  <text x="470" y="366" class="mono code">vsock-server.py + llama.cpp</text>
  <text x="470" y="390" class="mono code">Llama 3.2 3B Instruct · Q4 GGUF</text>
  <text x="470" y="412" class="sans sub">baked into the EIF → measured in PCR0 · attestable via /dev/nsm</text>

  <!-- Footer -->
  <rect x="40" y="504" width="920" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="527" class="sans lbl"><tspan font-weight="600">Key constraint:</tspan> enclaves have no GPU → CPU-only inference → small quantized model.</text>
</svg>
